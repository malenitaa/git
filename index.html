<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://github-contributions-api.jogruber.de; img-src 'self' data:; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self';" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>contribution creatures</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="scene-bg" aria-hidden="true"></div>

<header class="topbar">
  <h1 class="logo">contribution&nbsp;creatures<span class="blink">_</span></h1>

  <form id="user-form" class="user-form" autocomplete="off">
    <label for="username-input" class="sr-only">GitHub username</label>
    <span class="input-prefix">@</span>
    <input
      id="username-input"
      name="user"
      type="text"
      placeholder="enter your github username"
      maxlength="39"
      spellcheck="false"
      autocapitalize="off"
    />
    <button type="submit" class="btn btn-primary" id="load-btn">load</button>
  </form>

  <div class="topbar-actions">
    <button type="button" id="range-toggle" class="btn btn-ghost" title="change range" hidden>
      last quarter
    </button>
    <button type="button" id="mute-btn" class="btn btn-icon" title="mute" aria-pressed="false">
      🔊
    </button>
    <button type="button" id="share-btn" class="btn btn-icon" title="copy link" hidden>
      🔗
    </button>
  </div>
</header>

<main id="app">
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <div id="stage-wrap" class="stage-wrap" hidden>
    <canvas id="scene" width="900" height="260"></canvas>
    <div id="legend" class="legend">
      <span>less</span>
      <i class="sw sw-0"></i><i class="sw sw-1"></i><i class="sw sw-2"></i><i class="sw sw-3"></i><i class="sw sw-4"></i>
      <span>more</span>
    </div>
    <div id="summary" class="summary"></div>
  </div>

  <div id="empty-hint" class="empty-hint">
    <p>enter a GitHub username to see their creatures hopping across the contribution map.</p>
    <p class="hint-small">e.g.: <button type="button" class="link-btn" data-demo="torvalds">torvalds</button></p>
  </div>
</main>

<footer class="footer">
  <span>data via <code>github-contributions-api.jogruber.de</code> · no backend of its own · cached locally</span>
</footer>

<script src="app.js"></script>
</body>
</html>
